<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLP · Admin Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0c;
    --fg: #f0ede6;
    --accent: #e05a00;
    --muted: #555;
    --line: #2a2a27;
    --hover: #161614;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:'Space Mono',monospace;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }

  .hub-label {
    font-size:8px; letter-spacing:.22em; color:var(--muted);
    margin-bottom:10px;
  }
  .hub-title {
    font-size:42px; font-weight:700; letter-spacing:-.02em;
    margin-bottom:6px;
  }
  .hub-title span { color:var(--accent); }
  .hub-sub {
    font-size:9px; letter-spacing:.1em; color:var(--muted);
    margin-bottom:56px;
  }

  .hub-grid {
    display:flex; flex-direction:column; gap:0;
    width:100%; max-width:420px;
  }

  .hub-link {
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 24px;
    border:1px solid var(--line);
    margin-bottom:-1px;
    text-decoration:none; color:var(--fg);
    transition:background .12s, border-color .12s;
    cursor:pointer;
  }
  .hub-link:hover { background:var(--hover); border-color:#444; }
  .hub-link:hover .hub-arrow { color:var(--accent); }

  .hub-link-left {}
  .hub-link-name {
    font-size:13px; font-weight:700; letter-spacing:.04em;
    margin-bottom:4px;
  }
  .hub-link-url {
    font-size:8px; letter-spacing:.1em; color:var(--muted);
  }
  .hub-arrow {
    font-size:16px; color:var(--muted);
    transition:color .12s;
  }

  .hub-divider {
    width:100%; max-width:420px;
    border:none; border-top:1px solid var(--line);
    margin:32px 0;
  }

  footer {
    font-size:8px; letter-spacing:.1em; color:var(--muted);
    margin-top:48px;
  }
</style>
</head>
<body>

  <div class="hub-label">ADMIN HUB</div>
  <div class="hub-title">SLP<span>.</span></div>
  <div class="hub-sub">SETLIST PLANNER</div>

  <div class="hub-grid">
    <a class="hub-link" href="landing.html">
      <div class="hub-link-left">
        <div class="hub-link-name">STARTPAGE</div>
        <div class="hub-link-url">landing.html</div>
      </div>
      <span class="hub-arrow">→</span>
    </a>
    <div class="hub-link" onclick="toggleArtists()">
      <div class="hub-link-left">
        <div class="hub-link-name">ARTIST PAGE</div>
        <div class="hub-link-url">artist.html?artist=band</div>
      </div>
      <span class="hub-arrow" id="artists-arrow">↓</span>
    </div>
    <div id="artists-dropdown" style="display:none;border:1px solid var(--line);border-top:none;margin-bottom:-1px">
      <div id="artists-list" style="padding:8px 0">
        <div style="padding:12px 24px;font-size:9px;letter-spacing:.1em;color:var(--muted)">LADEN…</div>
      </div>
    </div>
    <a class="hub-link" href="admin.html">
      <div class="hub-link-left">
        <div class="hub-link-name">ADMIN PAGE</div>
        <div class="hub-link-url">admin.html</div>
      </div>
      <span class="hub-arrow">→</span>
    </a>
  </div>

  <footer>gomaub.github.io/SLP</footer>

<script>
  const SUPABASE_URL = 'https://opcuiwlyfvrhipsrdftd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_MT7K3rDdmgJVIsHGB33G2g_TwNgxGPC';

  let artistsLoaded = false;
  let dropdownOpen = false;

  async function toggleArtists() {
    const dd = document.getElementById('artists-dropdown');
    const arrow = document.getElementById('artists-arrow');
    dropdownOpen = !dropdownOpen;
    dd.style.display = dropdownOpen ? 'block' : 'none';
    arrow.textContent = dropdownOpen ? '↑' : '↓';
    if (dropdownOpen && !artistsLoaded) await loadArtists();
  }

  async function loadArtists() {
    const listEl = document.getElementById('artists-list');
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/artists?select=id,name&order=name.asc', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
      const data = await res.json();
      artistsLoaded = true;
      if (!data.length) {
        listEl.innerHTML = '<div style="padding:12px 24px;font-size:9px;letter-spacing:.1em;color:var(--muted)">NOCH KEINE ARTISTS</div>';
        return;
      }
      listEl.innerHTML = '';
      data.forEach(function(a) {
        const link = document.createElement('a');
        link.href = 'artist.html?artist=' + a.id;
        link.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-top:1px solid var(--line);text-decoration:none;color:var(--fg);transition:background .1s;';
        link.innerHTML = '<span style="font-size:12px;font-weight:700;letter-spacing:.04em">' + a.name + '</span>' +
          '<span style="display:flex;align-items:center;gap:12px">' +
            '<span style="font-size:9px;color:var(--muted)">' + a.id + ' →</span>' +
            '<span data-delete="' + a.id + '" data-name="' + a.name + '" style="font-size:10px;color:#666;cursor:pointer;padding:2px 6px;border:1px solid #444" title="Löschen">✕</span>' +
          '</span>';
        link.addEventListener('mouseover', function(){ link.style.background='var(--hover)'; });
        link.addEventListener('mouseout',  function(){ link.style.background=''; });
        link.addEventListener('click', function(e){
          const del = e.target.closest('[data-delete]');
          if (del) {
            e.preventDefault();
            deleteArtist(del.dataset.delete, del.dataset.name);
          }
        });
        listEl.appendChild(link);
      });
    } catch(e) {
      listEl.innerHTML = '<div style="padding:12px 24px;font-size:9px;color:#cc3300">FEHLER: ' + e.message + '</div>';
    }
  }
  async function deleteArtist(id, name) {
    if (!confirm('Wirklich "' + name + '" löschen?')) return;
    if (!confirm('Sicher? Alle Daten gehen verloren!')) return;
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/artists?id=eq.' + id, {
        method: 'DELETE',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Prefer': 'return=minimal'
        }
      });
      if (res.ok) {
        artistsLoaded = false;
        await loadArtists();
      } else {
        alert('Fehler beim Löschen');
      }
    } catch(e) {
      alert('Fehler: ' + e.message);
    }
  }
</script>
</body>
</html>
